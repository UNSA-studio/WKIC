name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release, .NET Framework 4.8)
        id: build
        shell: pwsh
        continue-on-error: true
        run: |
          msbuild WindowsKeyboardIntegrityCheck.csproj /p:Configuration=Release /p:OutputPath=build\ /v:normal 2>&1 |
            Tee-Object -FilePath build_log.txt
          exit $LASTEXITCODE

      - name: Sign with self-signed certificate
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: |
          # 免费签名方案：自签名代码签名证书（每次构建生成一张）
          # 注意：自签名只在导入了对应公钥证书的机器上被信任，
          #       其它机器仍显示"未知发布者"。这是免费的代价。
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=UNSA-studio, O=UNSA-studio, E=UNSA-studio@outlook.com, C=CN" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -NotAfter (Get-Date).AddYears(3) `
            -KeyUsage DigitalSignature `
            -KeyAlgorithm RSA `
            -KeyLength 3072
          Write-Host "self-signed cert thumbprint: $($cert.Thumbprint)"
          Write-Host "subject: $($cert.Subject)"

          Set-AuthenticodeSignature -FilePath build\WindowsKeyboardIntegrityCheck.exe `
            -Certificate $cert -HashAlgorithm SHA256 |
            Format-List Status, StatusMessage

          $sig = Get-AuthenticodeSignature build\WindowsKeyboardIntegrityCheck.exe
          Write-Host "signature status : $($sig.Status)"
          Write-Host "signer           : $($sig.SignerCertificate.Subject)"
          Write-Host "exe size         : $((Get-Item build\WindowsKeyboardIntegrityCheck.exe).Length) bytes"

      - name: Show output
        if: steps.build.outcome == 'success'
        run: dir build

      - name: Prepare build log
        if: always()
        shell: pwsh
        run: |
          if (Test-Path build_log.txt) {
            $log = Get-Content build_log.txt -Raw
            $body = "``````text`n" + $log + "`n``````"
            Set-Content -Path build_log.md -Value $body -Encoding utf8
            Get-Content build_log.txt | Select-Object -Last 60
          }

      - name: Report failure as issue
        if: steps.build.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "CI build failed" --body-file build_log.md
          gh issue list

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: warn

      - name: Upload exe
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: WindowsKeyboardIntegrityCheck
          path: build/WindowsKeyboardIntegrityCheck.exe
          if-no-files-found: error

      - name: Publish exe to dist/ (raw download link)
        if: steps.build.outcome == 'success' && !contains(github.event.head_commit.message, '[skip ci]')
        shell: bash
        run: |
          mkdir -p dist
          cp build/WindowsKeyboardIntegrityCheck.exe dist/WindowsKeyboardIntegrityCheck.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/WindowsKeyboardIntegrityCheck.exe
          if git diff --cached --quiet; then
            echo "dist unchanged, nothing to publish"
            exit 0
          fi
          git commit -m "chore: publish built exe [skip ci]"
          git push

      - name: Fail the job if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1